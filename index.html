<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcoInvest — ИИ-консультант</title>
<style>
  :root{--green:#1d3a2f;--sage:#d9e4c8;--paper:#f6f3ec;--ink:#1d2a24;--muted:#6b7a70;--line:#e2ddd2}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
  .app{max-width:720px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
  header{background:var(--green);color:#f6f3ec;padding:18px 20px 16px}
  header .brand{font-size:13px;letter-spacing:.04em;opacity:.75}
  header h1{margin:4px 0 2px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  header .status{font-size:13px;color:var(--sage)}
  header .status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#9fd18b;margin-right:6px;vertical-align:1px}
  #log{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
  .bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
  .me{background:var(--green);color:#f6f3ec;align-self:flex-end;border-bottom-right-radius:4px}
  .typing{color:var(--muted);font-style:italic}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 10px}
  .chips button{border:1px solid var(--green);background:transparent;color:var(--green);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
  form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
  textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font:inherit;background:#fff;max-height:120px}
  form button{border:0;background:var(--green);color:#f6f3ec;border-radius:14px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}
  form button:disabled{opacity:.5}
  .note{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">EcoInvest Group · Bali</div>
    <h1>ИИ-консультант</h1>
    <div class="status">на связи 24/7 · RU / EN</div>
  </header>
  <div id="log"></div>
  <div class="chips" id="chips">
    <button>Какие виллы сейчас свободны?</button>
    <button>Сколько можно зарабатывать на сдаче?</button>
    <button>Как устроено владение для иностранца?</button>
    <button>Write in English</button>
  </div>
  <div class="note">Демо для коммерческого предложения. Условия сделки подтверждает менеджер EcoInvest.</div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="Задайте вопрос о виллах…" maxlength="1500"></textarea>
    <button id="b">→</button>
  </form>
</div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),b=document.getElementById('b'),chips=document.getElementById('chips');
const history=[];let API='';const ready=fetch('config.json?'+Date.now()).then(r=>r.json()).then(c=>{API=c.api||''}).catch(()=>{});
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
add('Здравствуйте! Я консультант EcoInvest. Расскажу о виллах на Бали, помогу выбрать и посчитать доходность. Что вас интересует?','bot');
async function send(text){
  text=text.trim(); if(!text) return;
  chips.style.display='none'; add(text,'me'); history.push({role:'user',content:text});
  t.value=''; b.disabled=true; const w=add('Консультант печатает…','bot typing');
  try{
    await ready;const r=await fetch(API+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const j=await r.json(); w.remove();
    if(j.reply){add(j.reply,'bot');history.push({role:'assistant',content:j.reply})}
    else add(j.error||'Ошибка. Попробуйте ещё раз.','bot');
  }catch(e){w.remove();add('Нет связи. Попробуйте ещё раз.','bot')}
  b.disabled=false; t.focus();
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(t.value)};
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(t.value)}});
chips.querySelectorAll('button').forEach(x=>x.onclick=()=>send(x.textContent));
</script>
</body>
</html>
